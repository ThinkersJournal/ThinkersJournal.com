name: CI

# Four HARD gates, one job each, so each job name can be a required check on its own.
# A job that dies in an early step asserts nothing about the steps below it while its
# name goes on claiming otherwise. Separate jobs keep each name answering for one gate.
#
#   1. Tree-freshness guard  -- tests/freshness.spec.ts: the guard's decision table plus
#                               an end-to-end run against a real squash-merged repository
#   2. Type check            -- `astro check`
#   3. Build                 -- `astro build`, the same build Cloudflare Pages runs
#   4. Playwright + axe      -- the full suite against `astro preview` of the built site
#
# WHY (1) RUNS THE GUARD'S TESTS AND NOT THE GUARD. `scripts/check-tree-freshness.mjs`
# guards a developer's LOCAL tree. A CI checkout of a pull_request is a detached merge
# commit, so the guard prints "NOT VERIFIED -- HEAD is detached" and exits 0. That
# step would be green on every PR whatever the guard's code said. What CI can check is
# that the guard still makes the right decision, and its own spec does that.
#
# Cloudflare Pages deploys on its own. A deploy status is not a gate, so nothing here
# deploys and none of these jobs depend on it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Tree-freshness guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No browser is needed: this spec drives git and the guard's exported functions.
      # Playwright's webServer still builds and previews the site first, as the config
      # requires.
      - name: Guard decision + end-to-end fixture (tests/freshness.spec.ts)
        run: npx playwright test tests/freshness.spec.ts

  check:
    name: Type check (astro check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: astro check
        run: npm run check

  build:
    name: Build (astro build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: astro build
        run: npm run build

  test:
    name: Playwright + axe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keyed on the lockfile, which pins @playwright/test exactly, so a version bump
      # busts the cache. On a hit only the OS libraries are installed, since they are
      # not in the cached directory.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and its OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's OS dependencies (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # `npx playwright test`, not `npm test`: the pretest hook runs the freshness guard,
      # which is "NOT VERIFIED" on a detached CI checkout (see the header). Job 1 covers
      # the guard.
      - name: Playwright suite, including axe accessibility checks
        run: npx playwright test

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
